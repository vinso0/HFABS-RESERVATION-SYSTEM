<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HappyFace Spa | Face & Body Reservations</title>
    <link rel="stylesheet" href="./public/css/landing.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="brand">
          <img
            src="./public/img/HFABS-LOGO.png"
            alt="Happy Face & Body Spa"
            class="brand-logo"
          />
          <span class="brand-name">Happy Face & Body Spa</span>
        </div>

        <nav class="nav">
          <a href="#home" class="nav-link active">Home</a>
          <a href="#services" class="nav-link">Services</a>
          <a href="./views/customer-login.html" class="nav-link">Login</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-icon">
          <img src="./public/img/HFABS-LOGO.png" alt="Happy Face & Body Spa" />
        </div>

        <h1 class="hero-title">Relax. Refresh. Renew.</h1>
        <p class="hero-subtitle">Your beauty and wellness, simplified.</p>

        <a href="./views/customer-login.html" class="cta-btn">
          Book an Appointment
        </a>
      </section>

      <section class="services" id="services">
        <h2 class="services-heading">Our Services</h2>

        <div class="services-grid">
          <div class="service-card">
            <div class="service-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 15L15 10L25 20L30 15L35 20L25 30L15 20L10 15Z" fill="#e91e8c"/>
              </svg>
            </div>
            <h3 class="service-title">Hair Services</h3>
            <button class="service-btn">View Services</button>
          </div>

          <div class="service-card active">
            <div class="service-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="15" r="5" fill="#e91e8c"/>
                <path d="M10 25C10 20 15 15 20 15C25 15 30 20 30 25" stroke="#e91e8c" stroke-width="2"/>
              </svg>
            </div>
            <h3 class="service-title">Nail Services</h3>
            <button class="service-btn active">View Services</button>
          </div>

          <div class="service-card">
            <div class="service-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="10" stroke="#e91e8c" stroke-width="2"/>
                <path d="M15 20C15 17 17 15 20 15C23 15 25 17 25 20" stroke="#e91e8c" stroke-width="2"/>
              </svg>
            </div>
            <h3 class="service-title">Facial Services</h3>
            <button class="service-btn">View Services</button>
          </div>

          <div class="service-card">
            <div class="service-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 10C15 10 10 15 10 20C10 25 15 30 20 30C25 30 30 25 30 20C30 15 25 10 20 10Z" stroke="#e91e8c" stroke-width="2"/>
              </svg>
            </div>
            <h3 class="service-title">Hair Treatments</h3>
            <button class="service-btn">View Services</button>
          </div>

          <div class="service-card">
            <div class="service-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 10L22 18L30 20L22 22L20 30L18 22L10 20L18 18L20 10Z" fill="#e91e8c"/>
              </svg>
            </div>
            <h3 class="service-title">Massage Services</h3>
            <button class="service-btn">View Services</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
