<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Happy Face & Body Spa</title>
    <link rel="stylesheet" href="../public/css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .forgot-password-container {
            max-width: 450px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .forgot-password-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .forgot-password-header h1 {
            color: var(--primary-pink);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .forgot-password-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-pink);
        }
        
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .submit-btn:hover {
            background: #b91566;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-to-login a {
            color: var(--primary-pink);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-to-login a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bubble-background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
        <div class="bubble bubble-6"></div>
        <div class="bubble bubble-7"></div>
        <div class="bubble bubble-8"></div>
    </div>

    <main class="forgot-password-container">
        <div class="forgot-password-header">
            <h1><i class="fas fa-lock"></i> Forgot Password</h1>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <div id="message-container"></div>

        <form id="forgot-password-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="btn-text">Send Reset Link</span>
                <span id="btn-loading" class="loading" style="display: none;"></span>
            </button>
        </form>

        <div class="back-to-login">
            <p>Remember your password? <a href="customer-login.html">Back to Login</a></p>
        </div>
    </main>

    <script>
        const API_BASE = '/HFABS/backend/public/index.php?url=';
        
        console.log('[ForgotPassword] Page loaded, initializing...');
        
        document.getElementById('forgot-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            console.log('[ForgotPassword] Form submission started');
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoading = document.getElementById('btn-loading');
            const messageContainer = document.getElementById('message-container');
            
            console.log('[ForgotPassword] Email entered:', email);
            
            // Clear previous messages
            messageContainer.innerHTML = '';
            
            // Disable button and show loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            
            try {
                console.log('[ForgotPassword] Sending API request to:', `${API_BASE}auth/requestPasswordReset`);
                
                const response = await fetch(`${API_BASE}auth/requestPasswordReset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });
                
                console.log('[ForgotPassword] API response received:', response.status, response.statusText);
                
                const data = await response.json();
                console.log('[ForgotPassword] API response data:', data);
                
                if (data.success) {
                    console.log('[ForgotPassword] Request successful, showing success message');
                    showMessage(data.message, 'success');
                    // Clear form
                    document.getElementById('email').value = '';
                } else {
                    console.log('[ForgotPassword] Request failed, showing error message:', data.message);
                    showMessage(data.message, 'error');
                }
                
            } catch (error) {
                console.error('[ForgotPassword] Network or parsing error:', error);
                console.error('[ForgotPassword] Error stack:', error.stack);
                showMessage('An error occurred. Please try again.', 'error');
            } finally {
                console.log('[ForgotPassword] Request completed, re-enabling button');
                // Re-enable button and hide loading
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        });
        
        function showMessage(message, type) {
            console.log(`[ForgotPassword] Showing ${type} message:`, message);
            
            const messageContainer = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageContainer.appendChild(messageDiv);
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                console.log('[ForgotPassword] Success message will auto-hide in 5 seconds');
                setTimeout(() => {
                    console.log('[ForgotPassword] Auto-hiding success message');
                    messageDiv.remove();
                }, 5000);
            }
        }
        
        // Log page interactions
        document.getElementById('email').addEventListener('input', function(e) {
            console.log('[ForgotPassword] Email input changed:', e.target.value);
        });
        
        console.log('[ForgotPassword] Initialization complete');
    </script>
</body>
</html>
