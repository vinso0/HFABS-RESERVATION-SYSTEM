<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Happy Face &amp; Body Spa</title>
  <link rel="stylesheet" href="../public/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <main class="auth-container">

    <!-- Brand Panel -->
    <div class="auth-brand">
      <img src="../public/img/HFABS-LOGO.png" alt="HFABS Logo" class="auth-brand-logo1" />
      <div>
        <div class="auth-brand-name">Happy Face &amp;<br>Body Spa</div>
        <p class="auth-brand-tagline">We'll help you get back in.</p>
      </div>
      <div class="auth-brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Form Panel -->
    <section class="auth-card">
      <div class="auth-icon-circle">
        <i class="fas fa-lock-open"></i>
      </div>

      <h1 class="auth-heading" style="text-align:center;">Forgot Password?</h1>
      <p class="auth-subheading" style="text-align:center;">
        Enter your email and we'll send you a reset link.
      </p>

      <div id="message-container"></div>

      <form id="forgot-password-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="you@email.com" required />
        </div>

        <button type="submit" class="auth-btn" id="submit-btn">
          <i class="fas fa-paper-plane"></i>
          <span id="btn-text">Send Reset Link</span>
        </button>
      </form>

      <p class="auth-footer-text" style="margin-top:1.25rem;">
        Remembered it?
        <a class="auth-link" href="customer-login.html">Back to Sign In</a>
      </p>
    </section>

  </main>

  <script>
    const API_BASE = '/HFABS/backend/public/index.php?url=';

    document.getElementById('forgot-password-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email     = document.getElementById('email').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const btnText   = document.getElementById('btn-text');
      const msgBox    = document.getElementById('message-container');

      msgBox.innerHTML = '';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="auth-spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></span> Sending...';

      try {
        const response = await fetch(`${API_BASE}auth/requestPasswordReset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (data.success) {
          showMessage(data.message, 'success');
          document.getElementById('email').value = '';
        } else {
          showMessage(data.message, 'error');
        }

      } catch (error) {
        showMessage('An error occurred. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> <span id="btn-text">Send Reset Link</span>';
      }
    });

    function showMessage(message, type) {
      const msgBox = document.getElementById('message-container');
      const icon   = type === 'success'
        ? '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>'
        : '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>';

      msgBox.innerHTML = `
        <div class="auth-alert auth-alert--${type}" style="margin-bottom:1rem;">
          <span class="auth-alert__icon">${icon}</span>
          <span class="auth-alert__msg">${message}</span>
        </div>`;

      if (type === 'success') setTimeout(() => { msgBox.innerHTML = ''; }, 6000);
    }
  </script>
</body>
</html>
