<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services | HappyFace Spa</title>
    <link rel="stylesheet" href="../public/css/landing.css" />
    <link rel="stylesheet" href="../public/css/services.css" />
  </head>
  <body>
    <div class="bubble-background">
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
      <div class="bubble bubble-4"></div>
      <div class="bubble bubble-5"></div>
      <div class="bubble bubble-6"></div>
      <div class="bubble bubble-7"></div>
      <div class="bubble bubble-8"></div>
    </div>

    <!-- Dynamic Navbar Container -->
    <div id="navbar-container"></div>

    <main>
      <div class="container">
        <div class="content-wrapper">
          <!-- Left Side: Services -->
          <div class="services-section">
            <h1 class="page-title">Services</h1>

            <!-- Category Toggle Button (Mobile) -->
            <button class="category-toggle" id="categoryToggle">
              <span>Select Category</span>
            </button>

            <!-- Category Tabs — dynamically populated from DB via services.js -->
            <div class="categories-tab" id="categoryTabs">
            </div>

            <!-- ADD THIS LINE BACK -->
            <h2 class="category-title" id="categoryTitle">Featured</h2>

            <!-- Services List -->
            <div id="servicesList" class="services-list">
              <div class="loading-state">Loading services...</div>
            </div>
          </div>

          <!-- Right Side: Summary -->
          <aside class="summary-sidebar">
            <div class="branch-info">
              <div class="branch-details">
                <h3 id="branchName">Loading...</h3>
                <p id="branchAddress">Please wait...</p>
              </div>
            </div>

            <div class="selected-services" id="selectedServices">
              <p class="empty-selection">No services selected yet</p>
            </div>

            <div class="total-section">
              <div class="total-row">
                <span>Total:</span>
                <span class="total-price" id="totalPrice">₱0</span>
              </div>
              <div class="total-row">
                <span id="downpaymentLabel">Downpayment Amount:</span>
                <span class="downpayment-price" id="downpaymentPrice">₱0</span>
              </div>
            </div>

            <button class="continue-btn" id="continueBtn" disabled>
              Continue
            </button>
            
            <div id="login-prompt" class="login-prompt" style="display: none; margin-top: 1rem; padding: 1rem; background-color: #fff3cd; border-radius: 8px; font-size: 0.9rem;">
              <p style="margin: 0;">Please <a href="./customer-login.html" style="color: #856404; font-weight: 500; text-decoration: none;">log in</a> to continue with your booking.</p>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="../public/js/services.js"></script>
    <script src="../public/js/navbar-loader.js"></script>
  </body>
</html>
