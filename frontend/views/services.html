<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services | HappyFace Spa</title>
  <link rel="stylesheet" href="../public/css/services.css" />
</head>
<body>
  <div class="bubble-background">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
    <div class="bubble bubble-6"></div>
    <div class="bubble bubble-7"></div>
    <div class="bubble bubble-8"></div>
  </div>

  <header class="header">
    <div class="header-container">
      <div class="brand">
        <img
          src="../public/img/HFABS-LOGO.png"
          alt="Happy Face & Body Spa"
          class="brand-logo"
        />
        <span class="brand-name">Happy Face & Body Spa</span>
      </div>

      <nav class="nav">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="../index.html#services" class="nav-link">Services</a>

      </nav>

  <main>
    <section class="services-page">
      <div class="services-header">
        <button class="back-btn" onclick="window.history.back()">← Back</button>
        <h1 class="services-title">Available Services</h1>
        <p class="branch-name" id="branchName">Loading...</p>
      </div>

      <div id="servicesGrid" class="services-grid">
        <div class="loading-state">Loading services...</div>
      </div>
    </section>
  </main>

  <script src="../public/js/services.js"></script>
