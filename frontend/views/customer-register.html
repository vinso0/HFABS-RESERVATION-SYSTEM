<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Account | HappyFace</title>
    <link rel="stylesheet" href="../public/css/auth.css" />
  </head>
  <body>
    <main class="auth-container">
      <section class="auth-card">
        <h1 class="auth-heading">Register Account</h1>

        <form
          class="auth-form"
          id="customer-register-form"
          method="POST"
          action="/backend/public/index.php/register"
        >
          <div class="form-group">
            <label class="form-label" for="reg-fullname">Full Name</label>
            <input
              class="form-input"
              type="text"
              id="reg-fullname"
              name="full_name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input
              class="form-input"
              type="email"
              id="reg-email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-contact">Contact Number</label>
            <input
              class="form-input"
              type="tel"
              id="reg-contact"
              name="contact_number"
              autocomplete="tel"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button 
                type="button" 
                class="password-toggle" 
                data-target="reg-password"
                tabindex="-1" 
                aria-label="Show password"
              ></button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-confirm-password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button 
                type="button" 
                class="password-toggle" 
                data-target="reg-confirm-password"
                tabindex="-1" 
                aria-label="Show password"
              ></button>
            </div>
          </div>

          <button class="auth-btn" type="submit">Register Account</button>

          <p class="auth-footer-text">
            Already have an account?
            <a class="auth-link" href="customer-login.html">Login</a>
          </p>
        </form>
      </section>
    </main>

    <script src="../public/js/auth.js"></script>
  </body>
</html>
