<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Account | HappyFace</title>
    <link rel="stylesheet" href="../public/css/auth.css" />
  </head>
  <body>
    <main class="auth-container">
      <section class="auth-card">
        <h1 class="auth-heading">Register Account</h1>

        <form
          class="auth-form"
          id="customer-register-form"
          method="POST"
          action="/backend/public/index.php/register"
        >
          <div class="form-group">
            <label class="form-label" for="reg-fullname">Full Name</label>
            <input
              class="form-input"
              type="text"
              id="reg-fullname"
              name="full_name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input
              class="form-input"
              type="email"
              id="reg-email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-contact">Contact Number</label>
            <input
              class="form-input"
              type="tel"
              id="reg-contact"
              name="contact_number"
              autocomplete="tel"
              required
            />
          </div>


          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button type="button" class="password-toggle" tabindex="-1" aria-label="Show password" onclick="togglePasswordVisibility('reg-password', this)">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path class="eye-open" d="M1 10C2.73 5.61 6.36 3 10 3C13.64 3 17.27 5.61 19 10C17.27 14.39 13.64 17 10 17C6.36 17 2.73 14.39 1 10Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                  <circle class="eye-open" cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
                  <g class="eye-slash" style="display:none"><path d="M3 3L17 17" stroke="currentColor" stroke-width="1.5"/><path d="M1 10C2.73 5.61 6.36 3 10 3C13.64 3 17.27 5.61 19 10C17.27 14.39 13.64 17 10 17C6.36 17 2.73 14.39 1 10Z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/></g>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-confirm-password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button type="button" class="password-toggle" tabindex="-1" aria-label="Show password" onclick="togglePasswordVisibility('reg-confirm-password', this)">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path class="eye-open" d="M1 10C2.73 5.61 6.36 3 10 3C13.64 3 17.27 5.61 19 10C17.27 14.39 13.64 17 10 17C6.36 17 2.73 14.39 1 10Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                  <circle class="eye-open" cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
                  <g class="eye-slash" style="display:none"><path d="M3 3L17 17" stroke="currentColor" stroke-width="1.5"/><path d="M1 10C2.73 5.61 6.36 3 10 3C13.64 3 17.27 5.61 19 10C17.27 14.39 13.64 17 10 17C6.36 17 2.73 14.39 1 10Z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/></g>
                </svg>
              </button>
            </div>
          </div>

          <button class="auth-btn" type="submit">Register Account</button>

          <p class="auth-footer-text">
            Already have an account?
            <a class="auth-link" href="customer-login.html">Login</a>
          </p>
        </form>
      </section>
    </main>

    <script src="../public/js/auth.js"></script>
    <script>
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const svg = btn.querySelector('.eye-icon');
        const open = svg.querySelectorAll('.eye-open');
        const slash = svg.querySelector('.eye-slash');
        if (input.type === 'password') {
          input.type = 'text';
          btn.setAttribute('aria-label', 'Hide password');
          open.forEach(e => e.style.display = 'none');
          if (slash) slash.style.display = '';
        } else {
          input.type = 'password';
          btn.setAttribute('aria-label', 'Show password');
          open.forEach(e => e.style.display = '');
          if (slash) slash.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
