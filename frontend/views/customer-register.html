<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customer Registration | HappyFace</title>
    <link rel="stylesheet" href="../public/css/auth.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-visual">
        <div class="auth-logo-placeholder"><img src="../public/img/HFABS-LOGO.png" alt="HappyFace Spa Logo" /></div>
      </section>

      <section class="auth-card" aria-labelledby="customer-register-heading">
        <h1 id="customer-register-heading">Register</h1>

        <form
          class="auth-form"
          id="customer-register-form"
          method="POST"
          action="/backend/public/index.php/register"
        ><!-- Placeholder palang yung laman ng action -->
          <div class="form-group">
            <label class="form-label" for="reg-fullname">Fullname</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="text"
                id="reg-fullname"
                name="full_name"
                autocomplete="name"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-contact">Contact No.</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="tel"
                id="reg-contact"
                name="contact_number"
                autocomplete="tel"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="email"
                id="reg-email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button
                class="password-toggle"
                type="button"
                aria-label="Toggle password visibility"
                data-target="reg-password"
              >
                Show
              </button>
            </div>
          </div>

          <button class="auth-btn" type="submit">Sign Up</button>

          <p class="auth-footer-text">
            Already have an account?
            <a class="auth-link" href="customer-login.html">Login</a>
          </p>
        </form>
      </section>
    </main>

    <script src="../public/js/auth.js"></script>
  </body>
</html>
