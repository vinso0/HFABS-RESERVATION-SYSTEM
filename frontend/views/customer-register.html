<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Happy Face &amp; Body Spa</title>
  <link rel="stylesheet" href="../public/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <main class="auth-container">

    <!-- Brand Panel -->
    <div class="auth-brand">
      <img src="../public/img/HFABS-LOGO.png" alt="HFABS Logo" class="auth-brand-logo" />
      <div>
        <div class="auth-brand-name">Happy Face &amp;<br>Body Spa</div>
        <p class="auth-brand-tagline">Join us and book your first session today.</p>
      </div>
      <div class="auth-brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Form Panel -->
    <section class="auth-card">
      <h1 class="auth-heading">Create Account</h1>
      <p class="auth-subheading">Fill in your details to get started.</p>

      <form id="customer-register-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="reg-fullname">Full Name</label>
          <input class="form-input" type="text" id="reg-fullname" name="username"
                 placeholder="Juan Dela Cruz" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <div class="form-input-wrapper">
            <input class="form-input" type="email" id="reg-email" name="email"
                   placeholder="you@email.com" autocomplete="email" required />
            <button type="button" id="send-otp-btn" class="otp-btn">Send OTP</button>
          </div>
        </div>

        <div class="form-group" id="otp-group" style="display: none;">
          <label class="form-label" for="reg-otp">Email Verification Code</label>
          <input class="form-input" type="text" id="reg-otp" name="otp"
                 placeholder="Enter 6-digit code" maxlength="6" pattern="[0-9]{6}" />
          <small class="form-help">Check your email for the verification code. Valid for 10 minutes.</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-contact">Contact Number</label>
          <input class="form-input" type="tel" id="reg-contact" name="contact_number"
                 placeholder="09XXXXXXXXX" autocomplete="tel" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="form-input-wrapper">
            <input class="form-input" type="password" id="reg-password" name="password"
                   placeholder="Min. 8 characters" autocomplete="new-password"
                   minlength="8" required />
            <button type="button" class="password-toggle"
                    data-target="reg-password" tabindex="-1" aria-label="Show password"></button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="form-input-wrapper">
            <input class="form-input" type="password" id="reg-confirm-password" name="confirm_password"
                   placeholder="Repeat your password" autocomplete="new-password"
                   minlength="8" required />
            <button type="button" class="password-toggle"
                    data-target="reg-confirm-password" tabindex="-1" aria-label="Show password"></button>
          </div>
        </div>

        <button class="auth-btn" type="submit">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

        <p class="auth-footer-text">
          Already have an account?
          <a class="auth-link" href="customer-login.html">Sign in</a>
        </p>
      </form>
    </section>

  </main>
  <script src="../public/js/auth.js"></script>
</body>
</html>
