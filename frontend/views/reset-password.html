<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Happy Face &amp; Body Spa</title>
  <link rel="stylesheet" href="../public/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <main class="auth-container">

    <!-- Brand Panel -->
    <div class="auth-brand">
      <img src="../public/img/HFABS-LOGO.png" alt="HFABS Logo" class="auth-brand-logo1" />
      <div>
        <div class="auth-brand-name">Happy Face &amp;<br>Body Spa</div>
        <p class="auth-brand-tagline">Set a new password to regain access.</p>
      </div>
      <div class="auth-brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Form Panel -->
    <section class="auth-card">

      <!-- Loading State -->
      <div id="loading-state" class="auth-state-panel">
        <div class="auth-spinner"></div>
        <p>Verifying reset link...</p>
      </div>

      <!-- Invalid Token State -->
      <div id="token-invalid" style="display:none;" class="auth-state-panel">
        <div class="auth-icon-circle auth-icon--error">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h2>Link Invalid or Expired</h2>
        <p>This password reset link is invalid or has already expired.</p>
        <a class="auth-link" href="forgot-password.html"
           style="margin-top:0.5rem;font-size:0.9rem;">
          <i class="fas fa-redo" style="margin-right:5px;"></i>Request a new link
        </a>
      </div>

      <!-- Reset Form -->
      <div id="reset-form" style="display:none;">
        <div class="auth-icon-circle">
          <i class="fas fa-key"></i>
        </div>
        <h1 class="auth-heading" style="text-align:center;">Reset Password</h1>
        <p class="auth-subheading" style="text-align:center;">Create a strong new password.</p>

        <!-- User Chip -->
        <div class="auth-user-chip" id="user-chip">
          <div class="auth-user-chip-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="auth-user-chip-info">
            <div class="auth-user-chip-name"  id="username">Loading...</div>
            <div class="auth-user-chip-email" id="email">Loading...</div>
          </div>
        </div>

        <div id="message-container"></div>

        <form id="reset-password-form" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <div class="form-input-wrapper">
              <input class="form-input" type="password" id="password" name="password"
                     placeholder="Min. 8 characters" required minlength="8" />
              <button type="button" class="password-toggle"
                      data-target="password" tabindex="-1" aria-label="Show password"></button>
            </div>
            <!-- Strength bar -->
            <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
            <div class="pw-strength-label" id="pw-label"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <div class="form-input-wrapper">
              <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
                     placeholder="Repeat your password" required />
              <button type="button" class="password-toggle"
                      data-target="confirmPassword" tabindex="-1" aria-label="Show password"></button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="submit-btn">
            <i class="fas fa-lock"></i>
            <span id="btn-text">Reset Password</span>
          </button>
        </form>

        <p class="auth-footer-text" style="margin-top:1.25rem;">
          <a class="auth-link" id="back-to-login" href="customer-login.html">
            <i class="fas fa-arrow-left" style="margin-right:4px;"></i>Back to Sign In
          </a>
        </p>
      </div>

    </section>
  </main>

  <!-- Password toggle -->
  <script src="../public/js/auth.js"></script>

  <script>
    const API_BASE = '/HFABS/backend/public/index.php?url=';
    const urlParams = new URLSearchParams(window.location.search);
    const token     = urlParams.get('token');

    if (!token) {
      showTokenInvalid();
    } else {
      verifyToken(token);
    }

    async function verifyToken(token) {
      try {
        const response = await fetch(`${API_BASE}auth/verifyResetToken`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token })
        });
        const data = await response.json();
        if (data.success) { showResetForm(data.user); }
        else              { showTokenInvalid(); }
      } catch (e) { showTokenInvalid(); }
    }

    function showTokenInvalid() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('token-invalid').style.display = 'flex';
    }

    function showResetForm(user) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('reset-form').style.display    = 'block';
      document.getElementById('username').textContent = user.username;
      document.getElementById('email').textContent    = user.email;
    }

    // Password strength
    document.getElementById('password').addEventListener('input', function () {
      const pw   = this.value;
      const fill = document.getElementById('pw-fill');
      const lbl  = document.getElementById('pw-label');

      if (!pw.length) { fill.className = 'pw-strength-fill'; lbl.textContent = ''; return; }

      let s = 0;
      if (pw.length >= 8)            s++;
      if (/[a-z]/.test(pw))          s++;
      if (/[A-Z]/.test(pw))          s++;
      if (/[0-9]/.test(pw))          s++;
      if (/[^a-zA-Z0-9]/.test(pw))   s++;

      if (s < 3)      { fill.className = 'pw-strength-fill pw-fill-weak';   lbl.className = 'pw-strength-label pw-weak';   lbl.textContent = 'Weak'; }
      else if (s < 5) { fill.className = 'pw-strength-fill pw-fill-medium'; lbl.className = 'pw-strength-label pw-medium'; lbl.textContent = 'Medium'; }
      else            { fill.className = 'pw-strength-fill pw-fill-strong'; lbl.className = 'pw-strength-label pw-strong'; lbl.textContent = 'Strong'; }
    });

    // Form submit
    document.getElementById('reset-password-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn       = document.getElementById('submit-btn');
      const msgBox          = document.getElementById('message-container');

      msgBox.innerHTML = '';

      if (password !== confirmPassword) {
        showMessage('Passwords do not match.', 'error'); return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="auth-spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></span> Resetting...';

      try {
        const response = await fetch(`${API_BASE}auth/resetPassword`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, password, confirmPassword })
        });
        const data = await response.json();

        if (data.success) {
          showMessage(data.message, 'success');
          setTimeout(() => { window.location.href = data.redirect; }, 2000);
        } else {
          showMessage(data.message, 'error');
        }
      } catch (e) {
        showMessage('An error occurred. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-lock"></i> <span id="btn-text">Reset Password</span>';
      }
    });

    function showMessage(message, type) {
      const msgBox = document.getElementById('message-container');
      const icon   = type === 'success'
        ? '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>'
        : '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>';
      msgBox.innerHTML = `
        <div class="auth-alert auth-alert--${type}" style="margin-bottom:1rem;">
          <span class="auth-alert__icon">${icon}</span>
          <span class="auth-alert__msg">${message}</span>
        </div>`;
      if (type === 'success') setTimeout(() => { msgBox.innerHTML = ''; }, 6000);
    }

    // Back to login routing (original logic preserved)
    const backLink  = document.getElementById('back-to-login');
    const referrer  = document.referrer;
    const userType  = urlParams.get('user_type');
    if (referrer.includes('admin-login.html') || userType === 'admin')           backLink.href = 'admin-login.html';
    else if (referrer.includes('superadmin-login.html') || userType === 'superadmin') backLink.href = 'superadmin-login.html';
    else                                                                          backLink.href = 'customer-login.html';
  </script>
</body>
</html>
