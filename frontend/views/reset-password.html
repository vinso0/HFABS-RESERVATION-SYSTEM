<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Happy Face & Body Spa</title>
    <link rel="stylesheet" href="../public/css/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .reset-password-container {
            max-width: 450px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .reset-password-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .reset-password-header h1 {
            color: var(--primary-pink);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .reset-password-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .user-info .username {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 1.1rem;
        }
        
        .user-info .email {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-pink);
        }
        
        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        
        .password-strength .weak { color: #dc3545; }
        .password-strength .medium { color: #ffc107; }
        .password-strength .strong { color: #28a745; }
        
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .submit-btn:hover {
            background: #b91566;
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .back-to-login {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-to-login a {
            color: var(--primary-pink);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-to-login a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .token-invalid {
            text-align: center;
            padding: 2rem;
        }
        
        .token-invalid i {
            font-size: 3rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="bubble-background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
        <div class="bubble bubble-6"></div>
        <div class="bubble bubble-7"></div>
        <div class="bubble bubble-8"></div>
    </div>

    <main class="reset-password-container">
        <div id="loading-state">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading" style="width: 32px; height: 32px; border-width: 3px; margin: 0 auto 1rem;"></div>
                <p>Verifying reset token...</p>
            </div>
        </div>

        <div id="token-invalid" style="display: none;">
            <div class="token-invalid">
                <i class="fas fa-exclamation-triangle"></i>
                <h2>Invalid or Expired Link</h2>
                <p>This password reset link is invalid or has expired.</p>
                <p>Please <a href="forgot-password.html">request a new password reset</a>.</p>
            </div>
        </div>

        <div id="reset-form" style="display: none;">
            <div class="reset-password-header">
                <h1><i class="fas fa-key"></i> Reset Password</h1>
                <p>Create a new password for your account.</p>
            </div>

            <div class="user-info">
                <div class="username" id="username">Loading...</div>
                <div class="email" id="email">Loading...</div>
            </div>

            <div id="message-container"></div>

            <form id="reset-password-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter new password" minlength="8">
                    <div class="password-strength" id="password-strength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm new password">
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="btn-text">Reset Password</span>
                    <span id="btn-loading" class="loading" style="display: none;"></span>
                </button>
            </form>

            <div class="back-to-login">
                <p><a href="#" id="back-to-login">Back to Login</a></p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '/HFABS/backend/public/index.php?url=';
        
        console.log('[ResetPassword] Page loaded, initializing...');
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        console.log('[ResetPassword] Token from URL:', token ? token.substring(0, 8) + '...' : 'NOT FOUND');
        
        if (!token) {
            console.log('[ResetPassword] No token found in URL, showing invalid token state');
            showTokenInvalid();
        } else {
            console.log('[ResetPassword] Token found, verifying...');
            verifyToken(token);
        }
        
        async function verifyToken(token) {
            console.log('[ResetPassword] Starting token verification...');
            console.log('[ResetPassword] Full token being verified:', token);
            console.log('[ResetPassword] Token length:', token ? token.length : 'null');
            console.log('[ResetPassword] Current URL:', window.location.href);
            
            try {
                console.log('[ResetPassword] Sending verification request to:', `${API_BASE}auth/verifyResetToken`);
                
                const response = await fetch(`${API_BASE}auth/verifyResetToken`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token })
                });
                
                console.log('[ResetPassword] Verification response received:', response.status, response.statusText);
                
                const data = await response.json();
                console.log('[ResetPassword] Verification response data:', data);
                console.log('[ResetPassword] Response success:', data.success);
                console.log('[ResetPassword] Response message:', data.message);
                
                if (data.success) {
                    console.log('[ResetPassword] Token verified successfully, user:', data.user.username);
                    showResetForm(data.user);
                } else {
                    console.log('[ResetPassword] Token verification failed:', data.message);
                    showTokenInvalid();
                }
                
            } catch (error) {
                console.error('[ResetPassword] Token verification error:', error);
                console.error('[ResetPassword] Error stack:', error.stack);
                showTokenInvalid();
            }
        }
        
        function showTokenInvalid() {
            console.log('[ResetPassword] Showing invalid token UI');
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('token-invalid').style.display = 'block';
        }
        
        function showResetForm(user) {
            console.log('[ResetPassword] Showing reset form for user:', user.username);
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('reset-form').style.display = 'block';
            document.getElementById('username').textContent = user.username;
            document.getElementById('email').textContent = user.email;
        }
        
        // Password strength checker
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthDiv = document.getElementById('password-strength');
            
            console.log('[ResetPassword] Password input changed, length:', password.length);
            
            if (password.length === 0) {
                strengthDiv.innerHTML = '';
                return;
            }
            
            let strength = 0;
            let message = '';
            let className = '';
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            if (strength < 3) {
                message = 'Weak password';
                className = 'weak';
            } else if (strength < 4) {
                message = 'Medium strength';
                className = 'medium';
            } else {
                message = 'Strong password';
                className = 'strong';
            }
            
            console.log('[ResetPassword] Password strength calculated:', strength, message);
            strengthDiv.innerHTML = `<span class="${className}">${message}</span>`;
        });
        
        // Handle form submission
        document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            console.log('[ResetPassword] Reset form submission started');
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoading = document.getElementById('btn-loading');
            const messageContainer = document.getElementById('message-container');
            
            console.log('[ResetPassword] Password length:', password.length);
            console.log('[ResetPassword] Passwords match:', password === confirmPassword);
            
            // Clear previous messages
            messageContainer.innerHTML = '';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                console.log('[ResetPassword] Passwords do not match validation failed');
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Disable button and show loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            
            try {
                console.log('[ResetPassword] Sending password reset request to:', `${API_BASE}auth/resetPassword`);
                
                const response = await fetch(`${API_BASE}auth/resetPassword`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        token: token,
                        password: password,
                        confirmPassword: confirmPassword
                    })
                });
                
                console.log('[ResetPassword] Reset response received:', response.status, response.statusText);
                
                const data = await response.json();
                console.log('[ResetPassword] Reset response data:', data);
                
                if (data.success) {
                    console.log('[ResetPassword] Password reset successful, will redirect to:', data.redirect);
                    showMessage(data.message, 'success');
                    setTimeout(() => {
                        console.log('[ResetPassword] Redirecting to login page...');
                        window.location.href = data.redirect;
                    }, 2000);
                } else {
                    console.log('[ResetPassword] Password reset failed:', data.message);
                    showMessage(data.message, 'error');
                }
                
            } catch (error) {
                console.error('[ResetPassword] Password reset error:', error);
                console.error('[ResetPassword] Error stack:', error.stack);
                showMessage('An error occurred. Please try again.', 'error');
            } finally {
                console.log('[ResetPassword] Reset request completed, re-enabling button');
                // Re-enable button and hide loading
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        });
        
        function showMessage(message, type) {
            console.log(`[ResetPassword] Showing ${type} message:`, message);
            
            const messageContainer = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageContainer.appendChild(messageDiv);
            
            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                console.log('[ResetPassword] Success message will auto-hide in 5 seconds');
                setTimeout(() => {
                    console.log('[ResetPassword] Auto-hiding success message');
                    messageDiv.remove();
                }, 5000);
            }
        }
        
        // Log form interactions
        document.getElementById('password').addEventListener('focus', function() {
            console.log('[ResetPassword] Password field focused');
        });
        
        document.getElementById('confirmPassword').addEventListener('focus', function() {
            console.log('[ResetPassword] Confirm password field focused');
        });
        
        console.log('[ResetPassword] Initialization complete');
        
        // Set back to login link based on referrer
        const backToLoginLink = document.getElementById('back-to-login');
        const referrer = document.referrer;
        const currentUrl = window.location.href;
        
        console.log('[ResetPassword] Referrer:', referrer);
        console.log('[ResetPassword] Current URL:', currentUrl);
        
        // Determine which login page to go back to
        let loginPage = 'customer-login.html'; // default
        
        if (referrer.includes('admin-login.html')) {
            loginPage = 'admin-login.html';
        } else if (referrer.includes('superadmin-login.html')) {
            loginPage = 'superadmin-login.html';
        } else if (referrer.includes('customer-login.html')) {
            loginPage = 'customer-login.html';
        } else {
            // Check URL parameters or other indicators
            const urlParams = new URLSearchParams(window.location.search);
            const userType = urlParams.get('user_type');
            
            if (userType === 'admin') {
                loginPage = 'admin-login.html';
            } else if (userType === 'superadmin') {
                loginPage = 'superadmin-login.html';
            }
        }
        
        backToLoginLink.href = loginPage;
        console.log('[ResetPassword] Back to login link set to:', loginPage);
    </script>
</body>
</html>
