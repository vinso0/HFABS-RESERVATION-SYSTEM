<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Happy Face &amp; Body Spa</title>
  <link rel="stylesheet" href="../public/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* Admin-specific brand panel override */
    .auth-brand {
      background: linear-gradient(150deg, #1a1a2e 0%, #2d1b3d 50%, #3d0f2b 100%);
    }
    .auth-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(233, 30, 140, 0.25);
      border: 1px solid rgba(233, 30, 140, 0.4);
      color: #f9a8d4;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 1rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <main class="auth-container">

    <!-- Brand Panel -->
    <div class="auth-brand">
      <img src="../public/img/HFABS-LOGO.png" alt="HFABS Logo" class="auth-brand-logo" />
      <div>
        <div class="auth-brand-name">Happy Face &amp;<br>Body Spa</div>
        <p class="auth-brand-tagline">Branch administration portal.</p>
      </div>
      <div class="auth-brand-badge">
        <i class="fas fa-shield-alt"></i> Staff Access
      </div>
      <div class="auth-brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Form Panel -->
    <section class="auth-card">
      <h1 class="auth-heading">Admin Sign In</h1>
      <p class="auth-subheading">Enter your credentials to access the branch dashboard.</p>

      <form class="auth-form" id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-identifier">
            <i class="fas fa-user" style="color:#e91e8c;margin-right:5px;font-size:10px;"></i>
            Username or Email
          </label>
          <input
            class="form-input"
            type="text"
            id="admin-identifier"
            name="username"
            placeholder="Username or email address"
            autocomplete="username"
            required
          />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="admin-password">
            <i class="fas fa-lock" style="color:#e91e8c;margin-right:5px;font-size:10px;"></i>
            Password
          </label>
          <div class="form-input-wrapper">
            <input class="form-input" type="password" id="admin-password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="password-toggle"
                    data-target="admin-password" tabindex="-1" aria-label="Show password"></button>
          </div>
        </div>

        <button class="auth-btn" type="submit">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <p class="auth-footer-text" style="margin-top:1rem;">
          <a class="auth-link" href="forgot-password.html"
             style="font-size:0.82rem;">
            <i class="fas fa-key" style="margin-right:4px;"></i>Forgot password?
          </a>
        </p>
      </form>
    </section>

  </main>
  <script src="../public/js/auth.js"></script>
</body>
</html>
