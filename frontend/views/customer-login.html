<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customer Login | HappyFace</title>
    <link rel="stylesheet" href="../public/css/auth.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-visual">
        <!-- Replace placeholder with your PNG logo later -->
        <div class="auth-logo-placeholder"><img src="../public/img/HFABS-LOGO.png" alt="HappyFace Spa Logo" /></div>
      </section>

      <section class="auth-card" aria-labelledby="customer-login-heading">
        <h1 id="customer-login-heading">Customer Login</h1>

        <form
          class="auth-form"
          id="customer-login-form"
          method="POST"
          action="/backend/public/index.php/login"
        ><!-- Placeholder palang yung laman ng action -->
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="email"
                id="login-email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="form-input-wrapper">
              <input
                class="form-input"
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                required
              />
              <button
                class="password-toggle"
                type="button"
                aria-label="Toggle password visibility"
                data-target="login-password"
              >
                Show
              </button>
            </div>
          </div>

          <div class="form-inline">
            <input
              type="checkbox"
              id="remember-me"
              name="remember"
              value="1"
            />
            <label for="remember-me">Remember me</label>
          </div>

          <button class="auth-btn" type="submit">Login</button>

          <p class="auth-footer-text">
            Don't have an account?
            <a class="auth-link" href="customer-register.html">Sign Up</a>
          </p>
        </form>
      </section>
    </main>

    <script src="../public/js/auth.js"></script>
  </body>
</html>
