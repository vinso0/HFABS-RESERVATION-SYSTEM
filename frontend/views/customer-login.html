<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Happy Face &amp; Body Spa</title>
  <link rel="stylesheet" href="../public/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <main class="auth-container">

    <!-- Brand Panel -->
    <div class="auth-brand">
      <span class="auth-brand-inner-ring"></span>
      <img src="../public/img/HFABS-LOGO.png" alt="HFABS Logo" class="auth-brand-logo" />
      <div>
        <div class="auth-brand-name">Happy Face &amp;<br>Body Spa</div>
        <p class="auth-brand-tagline">Your wellness journey starts here.</p>
        <!-- register: "Join us and book your first session today." -->
      </div>
      <div class="auth-brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Form Panel -->
    <section class="auth-card">
      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Sign in to manage your account.</p>

      <form class="auth-form" id="customer-login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">
            <i class="fas fa-user" style="color:#e91e8c;margin-right:5px;font-size:10px;"></i>
            Username or Email
          </label>
          <input
            class="form-input"
            type="text"
            id="login-identifier"
            name="username"
            placeholder="Username or email address"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="form-input-wrapper">
            <input class="form-input" type="password" id="login-password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="password-toggle"
                    data-target="login-password" tabindex="-1" aria-label="Show password"></button>
          </div>
        </div>

        <div class="auth-forgot">
          <a class="auth-link" href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="auth-btn" type="submit">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <p class="auth-footer-text">
          Don't have an account?
          <a class="auth-link" href="customer-register.html">Create one</a>
        </p>
      </form>
    </section>

  </main>
  <script src="../public/js/auth.js"></script>
</body>
</html>
