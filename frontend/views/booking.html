<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment | HappyFace Spa</title>
  <link rel="stylesheet" href="../public/css/landing.css" />
  <link rel="stylesheet" href="../public/css/booking.css" />
</head>
<body>
  <div class="bubble-background">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
    <div class="bubble bubble-6"></div>
    <div class="bubble bubble-7"></div>
    <div class="bubble bubble-8"></div>
  </div>

  <!-- Dynamic Navbar Container -->
  <div id="navbar-container"></div>

  <main>
    <div class="container">
      <div class="booking-wrapper">
        <div class="booking-card">
          <!-- Service Summary -->
          <div class="service-summary">
            <h2 class="booking-title" id="serviceName">Loading...</h2>
            <p class="service-price" id="servicePrice">₱0.00</p>
            <p class="service-downpayment" id="serviceDownpayment">Downpayment: ₱0.00</p>
            <p class="service-duration" id="serviceDuration">Duration: N/A</p>
            <p class="service-hours" id="serviceHours">Hours: N/A</p>
          </div>

          <!-- Date Selection -->
          <div class="booking-section">
            <h3 class="section-title">Select Date</h3>
            <div class="calendar">
              <div class="calendar-header">
                <button class="calendar-nav" id="prevMonth" aria-label="Previous month">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/>
                  </svg>
                </button>
                <span class="calendar-month" id="currentMonth">January 2026</span>
                <button class="calendar-nav" id="nextMonth" aria-label="Next month">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/>
                  </svg>
                </button>
              </div>
              <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar days will be generated here -->
              </div>
            </div>
          </div>

          <!-- Time Selection -->
          <div class="booking-section" id="timeSection" style="display: none;">
            <h3 class="section-title">Select Time</h3>

            <!-- Advance Notice Warning (shown only for today's date) -->
            <div class="advance-notice-warning" id="advanceNoticeWarning" style="display: none;">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
              </svg>
              <span>Reservations must be made at least 8 hours in advance. Grayed slots are unavailable.</span>
            </div>

            <div class="time-slots" id="timeSlots">
              <!-- Time slots will be generated here -->
            </div>
          </div>

          <!-- Info Message -->
          <div class="info-message" id="infoMessage" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
            </svg>
            <span>You cannot book another service if you already have a reservation at the same date and time.</span>
          </div>

          <!-- Action Button -->
          <button class="proceed-btn" id="proceedBtn" disabled>
            Proceed to Payment
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="../public/js/navbar-loader.js"></script>
  <script src="../public/js/booking.js"></script>
</body>
</html>
